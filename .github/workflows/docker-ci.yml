name: Build Docker Image

on:
  push:
    branches:
      - '**'
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GHA_PAT || github.token }}
      - name: Extract the branch name
        id: branch
        working-directory: amanzi
        run: |
          AMANZI_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "AMANZI_BRANCH=$AMANZI_BRANCH" >> $GITHUB_ENV
      - name: Filter the branch name to generate a tag for Docker
        id: tag
        run:
          echo "AMANZI_BRANCH_TAG=$(echo ${{env.AMANZI_BRANCH}} | sed -e 's/\//--/g')" >> $GITHUB_ENV
      - name: Get TPLs version
        id: version
        working-directory: amanzi/Docker
        run: |
          ls *
          echo "AMANZI_TPLS_VER=$(./get_tpls_version.sh)" >> $GITHUB_ENV
      - name: Output the TPLs version
        run:
          echo "TPLs version = ${{env.AMANZI_TPLS_VER}}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Docker/Dockerfile-run
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-${{ matrix.arch }}
          build-args: |
            amanzi_branch='master'
            amanzi_tpls_ver=${{env.AMANZI_TPLS_VER}}
            ats_branch='master'
  test-elmats:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ELM-ATS single column (${{ matrix.arch }})
    container:
      image: ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-${{ matrix.arch }}
    steps:
      - name: run test case
        run: |
          export USE_ATS=TRUE
          cd /home/amanzi_user/compass/examples/oakharbor_column && ./build_example.sh
  test-elmonly:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ELM only single column (${{ matrix.arch }})
    container:
      image: ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-${{ matrix.arch }}
    steps:
      - name: run test case
        run: |
          export USE_ATS=FALSE
          cd /home/amanzi_user/compass/examples/oakharbor_column && ./build_example.sh
  serial-transect:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Serial transect (${{ matrix.arch }})
    container:
      image: ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-${{ matrix.arch }}
    steps:
      - name: run test case
        run: |
          export USE_ATS=TRUE
          cd /home/amanzi_user/compass/examples/oakharbor_transect && ./build_example.sh
  parallel-transect:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Parallel transect (${{ matrix.arch }})
    container:
      image: ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-${{ matrix.arch }}
    steps:
      - name: run test case
        run: |
          export USE_ATS=TRUE
          export NTASKS=2
          cd /home/amanzi_user/compass/examples/oakharbor_transect && ./build_example.sh
  fix-manifest:
    needs: [test-elmats, test-elmonly, serial-transect, parallel-transect]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Pull images
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-arm64
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-amd64
      - name: Create and push manifest
        run: |
          docker manifest create ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest \
            --amend ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-arm64 \
            --amend ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest-amd64
          docker manifest push ${{ vars.DOCKERHUB_USERNAME }}/compass-elm-ats:latest
